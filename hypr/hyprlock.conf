$font = "DejaVu Sans Mono"

$gruvbox_dark_bg0_soft = rgba(32302fff)
$gruvbox_dark_bg1 = rgba(3c3836ff)
$gruvbox_dark_bg3 = rgba(665c54ff)
$gruvbox_dark_fg0 = rgba(fbf1c7ff)
$gruvbox_dark_fg1 = rgba(ebdbb2ff)
$gruvbox_dark_gray_dark = rgba(a89984ff)
$gruvbox_dark_purple_dark = rgba(b16286ff)
$gruvbox_dark_purple_light = rgba(d3869bff)
$gruvbox_dark_red_dark = rgba(cc241dff)
$gruvbox_dark_red_light = rgba(fb4934ff)
$gruvbox_dark_yellow_dark = rgba(d79921ff)
$gruvbox_dark_yellow_light = rgba(fabd2fff)
$gruvbox_dark_blue_dark = rgba(458588ff)
$gruvbox_dark_blue_light = rgba(83a598ff)
$gruvbox_dark_green_dark = rgba(98971aff)
$gruvbox_dark_green_dark = rgba(b8bb26ff)
$gruvbox_dark_aqua_dark = rgba(689d6aff)
$gruvbox_dark_aqua_light = rgba(8ec07cff)
$gruvbox_dark_orange_dark = rgba(d65d0eff)
$gruvbox_dark_orange_light = rgba(fe8019ff)

$text_color = $gruvbox_dark_fg1
$inner_color = $gruvbox_dark_bg0_soft
$outer_color = $gruvbox_dark_purple_dark $gruvbox_dark_purple_light 45deg
$check_color = $gruvbox_dark_aqua_dark $gruvbox_dark_aqua_light 45deg
$fail_color = $gruvbox_dark_red_dark $gruvbox_dark_red_light 45deg

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# # Background blur
# background {
#     monitor =
#     path = screenshot
#     blur_passes = 3
# }

background {
    monitor =
    path = $HOME/Pictures/backgrounds/bg.jpg
}


input-field {
    monitor =
    size = 40%, 5%
    outline_thickness = 3

    #inner_color = rgba(0, 0, 0, 0.0) # no fill
    #outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    #check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    #fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    inner_color = $inner_color
    outer_color = $outer_color
    check_color = $check_color
    fail_color = $fail_color

    font_color = $text_color
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = $text_color

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] LC_TIME=c date +"%a %Y-%m-%d" # update every 60 seconds
    font_size = 30
    font_family = $font
    color = $text_color

    position = -30, -150
    halign = right
    valign = top
}

shape {
    monitor =
    size = 370, 190
    color = $inner_color
    rounding = 15 # circle
    border_size = 3
    border_color = $outer_color
    position = -10, -10
    halign = right
    valign = top
}
